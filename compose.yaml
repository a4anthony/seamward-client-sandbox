services:
  candidate-api:
    build: .
    env_file:
      - .env
    environment:
      PORT: 4200
    ports:
      - "4200:4200"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4200/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
